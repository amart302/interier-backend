name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: catalog_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U test -d catalog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Check catalog API with PostgreSQL
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/catalog_test
        run: |
          npm run prisma:migrate:deploy
          INTEGRATION_DATABASE_URL="$DATABASE_URL" node --test tests/catalog.integration.cjs

  deploy:
    name: Deploy Application
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: interior-production
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            echo "Starting backend deployment..."
            cd /opt/interier-backend

            echo "Pulling latest changes..."
            git pull origin main

            echo "Building and starting Docker containers..."
            docker compose up -d --build

            echo "Waiting for API readiness..."
            for attempt in $(seq 1 24); do
              container_id="$(docker compose ps -aq api)"
              if [ -n "$container_id" ] &&
                [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy" ]; then
                echo "API and database are ready."
                exit 0
              fi
              sleep 5
            done

            docker compose ps -a
            docker compose logs --tail=100 api migrate
            exit 1